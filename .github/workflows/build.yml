name: Build and publish Bedrock Voice Bridge
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=android --project-name bedrock_voice_bridge .
      - name: Add microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: android-test-build, path: build/app/outputs/flutter-apk/app-release.apk}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=ios --project-name bedrock_voice_bridge .
      - name: Add microphone usage text
        run: /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string Bedrock Voice Bridge uses your microphone for voice chat.' ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r BedrockVoiceBridge-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: {name: ios-unsigned-test-build, path: build/ios/ipa/BedrockVoiceBridge-unsigned.ipa}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create --platforms=windows --project-name bedrock_voice_bridge .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{A73D4B5C-7C3B-4B88-9D37-BC4B8F91D110}
          AppName=Bedrock Voice Bridge
          AppVersion=1.0.0
          DefaultDirName={autopf}\Bedrock Voice Bridge
          DefaultGroupName=Bedrock Voice Bridge
          OutputDir=installer
          OutputBaseFilename=BedrockVoiceBridge-Setup-1.0.0
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Bedrock Voice Bridge"; Filename: "{app}\bedrock_voice_bridge.exe"
          Name: "{autodesktop}\Bedrock Voice Bridge"; Filename: "{app}\bedrock_voice_bridge.exe"
          '@ | Set-Content installer.iss
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with: {name: windows-installer-test-build, path: installer/BedrockVoiceBridge-Setup-1.0.0.exe}
  bedrock-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Bedrock add-on
        run: |
          mkdir -p dist/package
          cd bedrock-addon
          zip -r ../dist/package/BedrockVoiceBridge-Addon-1.0.0.mcpack .
          cd ../dist/package
          zip ../BedrockVoiceBridge-Addon-1.0.0.mcaddon BedrockVoiceBridge-Addon-1.0.0.mcpack
      - uses: actions/upload-artifact@v4
        with: {name: bedrock-addon-test-build, path: dist/BedrockVoiceBridge-Addon-1.0.0.mcaddon}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows, bedrock-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-files, merge-multiple: false}
      - name: Flatten release assets
        run: |
          mkdir -p release
          find release-files -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          name: Bedrock Voice Bridge ${{ github.ref_name }}
          body: |
            Download the installer/add-on below from **Assets** on this GitHub Release.
            Do not download from Actions → Artifacts; those are development build outputs.
            Note: this build is a test candidate. The Bedrock add-on does not itself capture microphone audio; install the companion app and use a compatible voice server.
          files: release/*
