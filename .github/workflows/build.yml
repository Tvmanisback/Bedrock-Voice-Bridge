name: Build apps and server plugin
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name bedrock_voice_bridge .
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bvb-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --project-name bedrock_voice_bridge .
      - run: flutter pub get
      - run: flutter build ipa --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: bvb-ios-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name bedrock_voice_bridge .
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bedrock-voice-bridge-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bvb-windows-app
          path: bedrock-voice-bridge-windows.zip
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle -p server-plugin clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bvb-server-plugin
          path: server-plugin/build/libs/*.jar
